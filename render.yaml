services:
  - type: web
    name: kiosk-helper
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MOCK_VISION
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.10
