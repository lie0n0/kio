<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>어르신 키오스크 도우미</title>
<style>
:root{--green:#0b6e4f;--bg:#f4f6f4;}
*{box-sizing:border-box}
body{font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:22px;line-height:1.6;margin:0;background:var(--bg);color:#111}
header{background:var(--green);color:#fff;padding:18px;text-align:center;font-size:28px;font-weight:800}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
#stage{background:#000;border-radius:16px;overflow:hidden;position:relative}
video{width:100%;display:block;background:#000;min-height:240px}
canvas{display:none}
#hint{text-align:center;color:#fff;background:#222;padding:10px;font-size:20px}
#chat{border:1px solid #ddd;background:#fff;border-radius:16px;padding:14px;min-height:220px;max-height:420px;overflow-y:auto;margin-top:12px}
.row{display:flex;margin:10px 0}
.row.bot{justify-content:flex-start}
.row.user{justify-content:flex-end}
.bubble{max-width:85%;border-radius:16px;padding:14px 16px;font-size:23px;line-height:1.6}
.bot .bubble{background:#e8f5e9;color:#0d3b2a;border:2px solid #0b6e4f}
.user .bubble{background:#0b6e4f;color:#fff}
.sys .bubble{background:#fff3cd;color:#664d03;border:2px dashed #b58900;width:100%;max-width:100%;text-align:center}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
button{font-size:24px;font-weight:700;min-height:64px;min-width:56px;border-radius:16px;border:3px solid var(--green);background:#fff;color:var(--green);cursor:pointer;padding:14px}
button.primary{background:var(--green);color:#fff}
button:active{transform:scale(.97)}
button:focus-visible{outline:4px solid #ffbf00;outline-offset:2px}
#micBtn.listening{background:#d32f2f;border-color:#d32f2f;color:#fff}
#status{text-align:center;font-size:22px;margin-top:10px;min-height:34px;font-weight:700}
footer{text-align:center;color:#555;font-size:19px;margin-top:14px}
@media(max-width:480px){.btn-grid{grid-template-columns:1fr}body{font-size:23px}}
</style>
</head>
<body>
<header>어르신 키오스크 도우미</header>
<main>
<div id="stage">
<video id="cam" autoplay playsinline muted></video>
<canvas id="shot" width="640" height="480"></canvas>
<div id="hint">카메라를 켜고 키오스크 화면을 보여주세요</div>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div class="btn-grid">
<button class="primary" onclick="startCam()">📷 카메라 켜기</button>
<button class="primary" onclick="captureAndExplain()">📸 촬영 · 설명 듣기</button>
<button id="micBtn" onclick="toggleMic()">🎤 말로 물어보기</button>
<button onclick="replay()">🔊 다시 듣기</button>
<button onclick="resetChat()">🏠 처음으로</button>
<button onclick="callStaff()">🔔 직원 호출</button>
</div>
<div id="chat" aria-live="polite"></div>
<footer>어렵시면 «직원 호출»을 눌러주세요. 천천히 또박또박 안내해 드립니다.</footer>
<script>
let lastSay="안녕하세요. 카메라를 켜고 키오스크 화면을 보여주시면, 한 단계씩 천천히 알려드릴게요.";
let recog=null, listening=false;
const chat=document.getElementById('chat');
const statusEl=document.getElementById('status');
function setStatus(t){statusEl.textContent=t||"";}
function scrollDown(){chat.scrollTop=chat.scrollHeight;}
function add(text,who){const r=document.createElement('div');r.className='row '+(who||'bot');const d=document.createElement('div');d.className='bubble';d.textContent=text;r.appendChild(d);chat.appendChild(r);scrollDown();}
function addSys(text){const r=document.createElement('div');r.className='row sys';const d=document.createElement('div');d.className='bubble';d.textContent=text;r.appendChild(d);chat.appendChild(r);scrollDown();}
function friendlyError(e){console.error(e);addSys("앗, 연결이 잠시 끊겼어요. 인터넷을 확인하시고 «촬영 · 설명 듣기»를 다시 눌러주세요.");speak("연결이 잠시 끊겼어요. 다시 한 번 촬영 버튼을 눌러주세요.");}
function speak(t){if(!t)return;lastSay=t;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=0.85;u.pitch=1.0;speechSynthesis.speak(u);}catch(e){console.error(e);}}
function replay(){if(!lastSay){addSys("아직 들려드릴 안내가 없어요. 먼저 촬영을 해주세요.");return;}add("🔊 다시 들려드릴게요.","bot");speak(lastSay);}
function resetChat(){chat.innerHTML="";try{speechSynthesis.cancel();}catch(e){}add("처음으로 돌아왔어요. 카메라를 켜고 촬영 버튼을 눌러주세요.","bot");speak("처음으로 돌아왔어요. 촬영 버튼을 눌러주세요.");setStatus("");}
function callStaff(){addSys("🔔 직원을 호출했어요. 잠시만 기다려주세요. 곧 도와드리러 옵니다.");speak("직원을 호출했습니다. 잠시만 기다려주세요. 곧 도와드리러 옵니다.");setStatus("직원을 호출했습니다. 잠시 기다려주세요.");}
async function startCam(){setStatus("카메라를 켜는 중…");try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});document.getElementById('cam').srcObject=s;add("카메라가 켜졌습니다. 키오스크 화면을 비춰주세요.","bot");setStatus("카메라 준비 완료!");}catch(e){console.error(e);const n=(e&&e.name)||"";if(n==="NotAllowedError"||n==="SecurityError"){addSys("카메라를 켤 수 없어요. 주소창 왼쪽 자물쇠에서 카메라 권한을 '허용'으로 바꿔주세요.");speak("카메라 권한을 허용해주세요.");setStatus("카메라 권한이 필요해요.");}else if(n==="NotFoundError"||n==="OverconstrainedError"){addSys("카메라를 찾을 수 없어요. 다른 앱이 카메라를 쓰고 있는지 확인해주세요.");speak("카메라를 찾을 수 없어요.");setStatus("카메라를 찾을 수 없어요.");}else{addSys("카메라를 켤 수 없어요. 주소창 왼쪽 자물쇠에서 카메라 권한을 '허용'으로 바꿔주세요.");speak("카메라 권한을 허용해주세요.");setStatus("카메라 권한이 필요해요.");}}}
async function captureAndExplain(){const video=document.getElementById('cam');if(!video.srcObject){addSys("먼저 «카메라 켜기»를 눌러주세요.");speak("먼저 카메라 켜기를 눌러주세요.");return;}setStatus("사진을 찍고 설명을 준비하는 중…");add("📸 사진을 찍었어요. 잠시만요…","user");try{const canvas=document.getElementById('shot');const ctx=canvas.getContext('2d');canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;ctx.drawImage(video,0,0,canvas.width,canvas.height);const b64=canvas.toDataURL('image/jpeg',0.8);const r=await fetch('/api/vision/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_b64:b64})});if(r.status===413){addSys("사진이 너무 커서 보낼 수 없어요. 다시 한 번 촬영 버튼을 눌러주세요.");speak("사진이 너무 커요. 다시 촬영해주세요.");setStatus("");return;}if(!r.ok)throw new Error('vision '+r.status);const j=await r.json();const steps=(j.steps||[]).join(" → ");if(steps)add("인식 단계: "+steps,"bot");const say=j.say_text||"화면을 확인했어요.";add("🔊 "+say,"bot");speak(say);setStatus("");}catch(e){friendlyError(e);setStatus("");}}
function toggleMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){const t=prompt("듣고 싶은 말씀을 적어주세요 (예: 결제로 하고 싶어)","결제로 하고 싶어");if(t)sendSpeech(t);return;}if(listening&&recog){recog.stop();return;}try{recog=new SR();recog.lang='ko-KR';recog.interimResults=false;recog.maxAlternatives=1;recog.onstart=()=>{listening=true;document.getElementById('micBtn').classList.add('listening');document.getElementById('micBtn').textContent="⏹ 말씀 중… 눌러서 끝내기";setStatus("듣고 있어요. 말씀해주세요…");};recog.onend=()=>{listening=false;const b=document.getElementById('micBtn');b.classList.remove('listening');b.textContent="🎤 말로 물어보기";};recog.onerror=(e)=>{console.error(e);addSys("잘 못 들었어요. 다시 한 번 천천히 말씀해주세요.");setStatus("");};recog.onresult=(e)=>{const t=e.results[0][0].transcript;add("🗣 "+t,"user");sendSpeech(t);};recog.start();}catch(e){friendlyError(e);}}
async function sendSpeech(transcript){setStatus("말씀을 이해하는 중…");try{const r=await fetch('/api/speech/intent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transcript:transcript})});if(!r.ok)throw new Error('stt '+r.status);const j=await r.json();if(j.intent)add("파악한 뜻: "+j.intent,"bot");const say=j.reply_text||"네, 알겠습니다.";add("🔊 "+say,"bot");speak(say);setStatus("");}catch(e){friendlyError(e);setStatus("");}}
// 초기 안내
add(lastSay,"bot");speak(lastSay);
</script>
</main>
</body>
</html>
